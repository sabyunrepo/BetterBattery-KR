name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Check patch formatting
        run: git diff --check

      - name: Build app and icon
        run: VERSION=1.0.0 bash build-app.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict build/BetterBattery.app
          test -s build/BetterBattery.app/Contents/Resources/LICENSE
          test -s build/BetterBattery.app/Contents/Resources/AppIcon.icns
